[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Евгений Колпаков"]
license = "MIT OR Apache-2.0"
description = "Эмулятор ЮТ-88 — советского самодельного домашнего компьютера (КР580ВМ80А / Intel 8080) из журнала «ЮТ для умелых рук» 1989–1990 годов"
readme = "README.md"
keywords = ["emulator", "intel-8080", "retrocomputing", "ut-88", "cp-m"]
categories = ["emulators"]
