[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Евгений Колпаков"]
license = "MIT OR Apache-2.0"
description = "Emulator of the UT-88, a Soviet DIY home computer (КР580ВМ80А / Intel 8080) from the 1989–1990 magazine «ЮТ для умелых рук»"
readme = "README.md"
keywords = ["emulator", "intel-8080", "retrocomputing", "ut-88", "cp-m"]
categories = ["emulators"]
