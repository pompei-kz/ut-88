[package]
name = "ut88-gui"
description = "Графический интерфейс эмулятора ЮТ-88"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ut88-core = { path = "../ut88-core" }
ut88-audio = { path = "../ut88-audio" }
i8080 = { path = "../i8080" }
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["eframe"] }
