name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Долгие тесты #[ignore] (тестер команд 8080, «Тетрис») раз в неделю.
    - cron: "0 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Сборка, тесты, проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка системных пакетов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Форматирование
        run: cargo fmt --all --check

      - name: Сборка
        run: cargo build --all-targets --locked

      - name: Тесты
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  long-tests:
    name: Долгие тесты (помеченные ignore)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка системных пакетов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Долгие тесты
        # Пропускаемому тесту ut88-audio нужна настоящая звуковая карта, поэтому он здесь исключён.
        run: >
          cargo test --release --locked --workspace --exclude ut88-audio
          -- --ignored
